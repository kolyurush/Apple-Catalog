<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЦРММчик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ЦРММчик</h1>
        <nav>
            <a href="#catalog">Каталог</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <section id="auth">
        <form id="login-form">
            <input type="text" name="login" placeholder="Логин">
            <input type="password" name="password" placeholder="Пароль">
            <button type="submit">Войти</button>
        </form>
        <p id="user-info"></p>
    </section>

    <main>
        <section id="catalog">
            <h2>Каталог товаров</h2>
            <div id="filters">
                <button id="btn-all">Показать все</button>
                <button id="btn-cheap">Только до 10 000 руб.</button>
                <button id="btn-sort">По цене ↑</button>
                <select id="category-filter">
                    <option value="all">Все категории</option>
                    <option value="sweet">Сладкие</option>
                    <option value="sour">Кислые</option>
                    <option value="mixed">Кисло-сладкие</option>
                    <option value="other">Другое</option>
                </select>
            </div>
            <div id="product-list"></div>
        </section>

        <section id="about">
            <h2>О компании</h2>
            <p>Мы продаём яблоки с 2007 года.</p>
        </section>
    </main>

    <section id="order">
        <h2>Быстрый заказ</h2>
        <form id="order-form" novalidate>
            <input type="text" name="name" placeholder="Ваше имя">
            <input type="email" name="email" placeholder="Email">
            <input type="number" name="quantity" placeholder="Количество" min="1" max="10">
            <button type="submit">Отправить заказ</button>
        </form>
        <p id="form-message"></p>
    </section>

    <footer>
        <p id="contacts">© 2026 ЦРММчик +79123456789</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
